name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch the Binaries workflow after a publish (gh workflow run).
  actions: write
  # Mint an OIDC token so npm attaches a provenance attestation to each publish.
  # (The repo is public and every package declares `repository`, which provenance
  # requires.) Publishing still authenticates with the automation NPM_TOKEN below;
  # migrating to full OIDC trusted publishing — which would retire the token — is
  # tracked separately (blocked on a scoped-package + changesets/action bug).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Gate access to NPM_TOKEN behind a protected Environment (configure required
    # reviewers + restrict to `main` in repo settings → Environments → npm-publish).
    environment: npm-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: bun install --frozen-lockfile

      # Do not publish a build that fails the full gate (lint + typecheck + test + build).
      - name: Verify
        run: bun run check

      # Explicit npm auth so `changeset publish` is authenticated regardless of the
      # toolchain (we use mise, not setup-node's registry-url). The token is read
      # from the environment at publish time; nothing secret is written to the repo.
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: bun run release
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with a provenance attestation (needs the id-token permission
          # above). npm records the source repo, commit, and workflow that built
          # the tarball, so consumers can verify it came from this repo.
          NPM_CONFIG_PROVENANCE: "true"

      # When the CLI was just published, kick off the standalone-binary build for
      # its release tag. This must be a `workflow_dispatch` (not a tag-`push`
      # trigger on the Binaries workflow): the tag Changesets pushes is created
      # with GITHUB_TOKEN, and GitHub does not start `push`-triggered runs for
      # tags created by GITHUB_TOKEN — but it *does* honour workflow_dispatch.
      - name: Build binaries for the published CLI release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$PUBLISHED" \
            | jq -r '.[] | select(.name == "@ontrove/cli") | "@ontrove/cli@" + .version')
          if [ -n "$tag" ]; then
            echo "Dispatching binaries build for $tag"
            gh workflow run binaries.yml -f tag="$tag"
          else
            echo "CLI not among the published packages; no binaries to build."
          fi
