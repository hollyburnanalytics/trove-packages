name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch the Binaries workflow after a publish (gh workflow run).
  actions: write
  # npm trusted publishing: the publish authenticates with a short-lived OIDC
  # token GitHub mints for this workflow, so there is no long-lived npm token to
  # expire or leak. Each package names this repo, `release.yml` and the
  # `npm-publish` environment as its trusted publisher on npmjs.com; a publish
  # from anywhere else is refused. npm also attaches a provenance attestation.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The trusted-publisher entry on npmjs.com names this environment, so a
    # publish has to run inside it. Restrict it to `main` in repo settings →
    # Environments → npm-publish.
    environment: npm-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: bun install --frozen-lockfile

      # Do not publish a build that fails the full gate (lint + typecheck + test + build).
      - name: Verify
        run: bun run check

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      # `changeset publish` shells out to this npm.
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      # v2 of the action writes no `.npmrc`. v1 always appended an
      # `_authToken=${NPM_TOKEN}` line, which overrode OIDC, and that is what
      # kept this workflow on a long-lived token until now.
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          publish-script: bun run release
          version-script: bun run version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # v1 pushed with the git CLI; keep that so release tags behave as before.
          push-with-git-cli: true

      # When the CLI was just published, kick off the standalone-binary build for
      # its release tag. This must be a `workflow_dispatch` (not a tag-`push`
      # trigger on the Binaries workflow): the tag Changesets pushes is created
      # with GITHUB_TOKEN, and GitHub does not start `push`-triggered runs for
      # tags created by GITHUB_TOKEN — but it *does* honour workflow_dispatch.
      - name: Build binaries for the published CLI release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$PUBLISHED" \
            | jq -r '.[] | select(.name == "@ontrove/cli") | "@ontrove/cli@" + .version')
          if [ -n "$tag" ]; then
            echo "Dispatching binaries build for $tag"
            gh workflow run binaries.yml -f tag="$tag"
          else
            echo "CLI not among the published packages; no binaries to build."
          fi

      # A new @ontrove/extend changes the runtime every official toolkit is
      # bundled with, so ask the trove repo to re-upload all of them. Without
      # this, a toolkit that needs the new runtime keeps running the old one
      # until someone redeploys it by hand. Needs TROVE_REPOS_TOKEN (a token
      # that may send repository_dispatch to hollyburnanalytics/trove); without
      # it this is skipped with a notice.
      - name: Redeploy official toolkits on the new runtime
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.TROVE_REPOS_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          version=$(printf '%s' "$PUBLISHED" \
            | jq -r '.[] | select(.name == "@ontrove/extend") | .version')
          if [ -z "$version" ]; then
            echo "@ontrove/extend not among the published packages; nothing to redeploy."
          elif [ -z "$GH_TOKEN" ]; then
            echo "::notice::TROVE_REPOS_TOKEN is not set; redeploy the toolkits for @ontrove/extend $version by hand."
          else
            gh api repos/hollyburnanalytics/trove/dispatches \
              -f event_type=extend-published \
              -f "client_payload[version]=$version"
            echo "Asked trove to redeploy every toolkit on @ontrove/extend $version."
          fi
